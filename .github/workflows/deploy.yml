name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone: the changelog `prebuild` reads the
          # git log, and a depth-1 checkout would bake a one-line (or empty)
          # changelog over the committed one. See scripts/build-changelog.mjs.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No committed lockfile, so use install (not ci). --legacy-peer-deps
      # works around the pre-existing eslint/eslint-config-next conflict.
      - run: npm install --legacy-peer-deps
      - name: Build static export
        env:
          # Serve under /<repo-name> on a project Pages site.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Bake the deployed commit SHA into the bundle (shown in feedback context).
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
